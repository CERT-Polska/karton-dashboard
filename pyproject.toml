[build-system]
requires = [
    "setuptools >= 40.9.0"
]
build-backend = "setuptools.build_meta"

[project]
name = "karton-dashboard"
description = "A small Flask application that allows for Karton task and queue introspection."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = [
    "Flask==3.1.3",
    "karton-core>=6.1.0,<7.0.0",
    "mistune<3.0.0",
    "prometheus_client==0.11.0",
    "networkx==2.6.3",
]

[dependency-groups]
dev = [
    "ruff==0.17.6",
    "mypy==2.4.1",
]

[project.urls]
Homepage = "https://github.com/CERT-Polska/karton-dashboard"
Repository = "https://github.com/CERT-Polska/karton-dashboard"

[project.scripts]
karton-dashboard = "karton.dashboard.cli:cli"
karton = "karton.core.main:main"
karton-auth = "karton.core.auth.cli:main"

[tool.setuptools]
packages = ["karton.dashboard"]

[tool.setuptools.dynamic]
version = {attr = "karton.dashboard.__version__.__version__"}

[tool.ruff]
extend-exclude = [
    "README.md"
]